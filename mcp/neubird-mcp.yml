server:
  name: neubird
  description: Official Model Context Protocol server for NeuBird AI (The Production Operations Agent).
    Lets AI assistants like Claude Code, Cursor, and GitHub Copilot drive NeuBird's autonomous incident
    investigation, root-cause analysis, and remediation capabilities. Runs locally (stdio via npx) or
    as a remote HTTP server; calls the NeuBird API at https://api.neubird.ai using the caller's credentials.
  transports:
  - stdio
  - http
  package: '@neubirdai/mcp-server-neubird'
  registry: npm
  version: 3.1.0
  install: npx -y @neubirdai/mcp-server-neubird@latest
  bin:
  - mcp-server-neubird
  - hawkeye-mcp-server
  repository: https://github.com/neubirdai/mcp-server-neubird
  docs: https://docs.neubird.ai/mcp/overview/
authentication:
  env:
  - NEUBIRD_EMAIL
  - NEUBIRD_PASSWORD
  - NEUBIRD_BASE_URL
  headers:
  - X-NeuBird-Email
  - X-NeuBird-Password
  - 'Authorization: Bearer <jwt>'
  notes: Bearer tokens are JWTs obtained from the NeuBird login API and validated via Auth0.
