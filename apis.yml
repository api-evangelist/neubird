name: Neubird
description: >-
  NeuBird AI is "The Production Operations Agent" — an autonomous AI SRE platform
  that investigates, triages, and resolves production incidents. It connects to an
  organization's existing observability and operations stack (Datadog, Splunk,
  CloudWatch, PagerDuty, ServiceNow, Slack, Kubernetes, AWS, Azure, OpenShift and
  30+ other tools) and delivers evidence-backed root-cause analysis in under three
  minutes without human investigation for L1/L2 incidents. NeuBird exposes its
  capabilities to developers and AI assistants through an official Model Context
  Protocol (MCP) server (@neubirdai/mcp-server-neubird, 33 tools), the NeuBird API
  at api.neubird.ai (Auth0-issued JWT bearer auth), a published community Agent
  Skills hub (FalconClaw SkillsHub, 17 skills), and the Neubird Falcon desktop
  workspace. Backed by Mayfield.
